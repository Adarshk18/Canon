[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "canon-memory"
dynamic = ["version"]
description = "Canon — governed project decision memory for AI coding agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Adarsh Sharma" }]
keywords = [
    "canon",
    "cli",
    "decisions",
    "architecture",
    "agents",
    "claude-code",
    "cursor",
    "git",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.5,<1",
    "rich>=13.7,<15",
]

[project.urls]
Homepage = "https://github.com/Adarshk18/Canon"
Documentation = "https://github.com/Adarshk18/Canon#readme"
Repository = "https://github.com/Adarshk18/Canon"
Issues = "https://github.com/Adarshk18/Canon/issues"
Changelog = "https://github.com/Adarshk18/Canon/blob/main/CHANGELOG.md"

[project.scripts]
canon = "canon.cli.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=6.0",
]

[tool.hatch.version]
path = "src/canon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/canon"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/PRIVACY.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/.env.example",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: uses a temporary git repository",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["canon"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
